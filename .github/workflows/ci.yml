name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A stalled step fails the run instead of holding a runner for hours
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run unit & regression tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # The browser comes from Playwright's own CDN (fast, cached between runs). The system packages come from
      # the runner's Ubuntu mirror, which sometimes stalls for many minutes: time-limit that step and retry it
      # once. The runner image already has nearly all of them, so if it still fails the job carries on, and
      # any library that is really missing shows up as a clear browser-launch error in the e2e step.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Install Chromium system packages
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            if timeout 180 npx playwright install-deps chromium; then exit 0; fi
            echo "Attempt $attempt to install system packages did not finish in time"
          done
          echo "::warning::Chromium system packages could not be installed from the Ubuntu mirror; continuing with the runner's preinstalled libraries"

      - name: Run end-to-end tests
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
