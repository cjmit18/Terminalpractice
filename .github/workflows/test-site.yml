name: Test site

# Keeps the private test site (branch site/wayne-mitchell, Worker terminus-wm) equal to main plus every open
# pull request, so every new feature can be tried in one place. See scripts/build-test-site.mjs.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  rebuild:
    # Pull requests from forks never touch the test site
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # One rebuild at a time; a newer event replaces a queued one. Set on the job, after the fork check,
    # so a skipped run from a fork never joins the group or cancels a real rebuild.
    concurrency:
      group: test-site
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild site/wayne-mitchell from main and the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        # main's copy of the script runs (never a pull request's). Until this workflow's own PR is merged, main has none.
        run: |
          if [ ! -f scripts/build-test-site.mjs ]; then
            echo "main has no scripts/build-test-site.mjs yet; nothing to rebuild"
            exit 0
          fi
          node scripts/build-test-site.mjs
